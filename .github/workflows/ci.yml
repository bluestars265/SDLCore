# .github/workflows/ci.yml
# 通用 GUI 库（基于 PySDL2）的持续集成与自动发布
# 支持 Python 3.10–3.13，跨平台

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # ---------- 系统级 SDL2 依赖 ----------
      - name: Install SDL2 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2 sdl2_image sdl2_ttf sdl2_mixer

      - name: Install SDL2 DLL (Windows)
        if: runner.os == 'Windows'
        run: pip install pysdl2-dll

      # ---------- Python 依赖安装 ----------
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install requirements.txt if exists
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Install project in editable mode
        run: pip install -e .

      - name: Install test tools
        run: pip install pytest

      # ---------- Windows 环境变量 ----------
      - name: Set SDL2_DLL_PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $dll_path = python -c "import pysdl2_dll, os; print(os.path.dirname(pysdl2_dll.__file__))"
          echo "SDL2_DLL_PATH=$dll_path" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$dll_path" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ---------- 运行测试 ----------
      - name: Run tests
        run: pytest tests/ -v

  # ---------- 自动发布到 PyPI ----------
  publish:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # 如需测试，取消下面注释：
        # with:
        #   repository-url: https://test.pypi.org/legacy/
