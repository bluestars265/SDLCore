name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # ---------- 系统级 SDL2 依赖 ----------
      - name: Install SDL2 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2 sdl2_image sdl2_ttf sdl2_mixer

      # ---------- Python 依赖 ----------
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install requirements.txt if exists
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Install project and test dependencies
        run: |
          pip install -e .
          pip install pytest

      # ---------- Windows 专属：安装 pysdl2-dll ----------
      - name: Install pysdl2-dll (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install pysdl2-dll --force-reinstall --no-cache-dir

      # ---------- Windows 专属：获取 DLL 路径并设置环境变量 ----------
      - name: Set SDL2_DLL_PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $dll_dir = $null
          # 方法1：尝试导入 pysdl2_dll（即使报错，也可能已释放文件）
          try {
            $dll_dir = python -c "import pysdl2_dll, os; print(os.path.dirname(pysdl2_dll.__file__))" 2>$null
            if ($LASTEXITCODE -ne 0) { throw "Import failed" }
          } catch {
            Write-Host "Import failed, trying pip show..."
            # 方法2：通过 pip show 获取包位置
            $pkg_info = pip show pysdl2-dll | Select-String "Location:"
            if ($pkg_info) {
              $location = ($pkg_info -split ":")[1].Trim()
              $dll_dir = Join-Path $location "pysdl2_dll"
            }
          }
          # 如果找到目录，设置环境变量
          if ($dll_dir -and (Test-Path $dll_dir)) {
            echo "SDL2_DLL_PATH=$dll_dir" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "$dll_dir" | Out-File -FilePath $env:GITHUB_PATH -Append
            Write-Host "SDL2_DLL_PATH set to $dll_dir"
            Write-Host "Directory contents:"
            dir $dll_dir
          } else {
            Write-Host "::warning::Could not locate pysdl2-dll directory. Tests may fail if they need SDL2."
          }

      # ---------- 确保测试目录存在（占位文件） ----------
      - name: Ensure test directory exists
        run: |
          if [ ! -d "tests" ]; then
            mkdir -p tests
            echo "def test_placeholder(): pass" > tests/test_placeholder.py
            echo "Created placeholder test file in tests/"
          else
            echo "tests/ directory already exists"
          fi
        shell: bash

      # ---------- 运行测试 ----------
      - name: Run tests
        run: pytest -v
